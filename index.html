<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pediatric Health Facts for Kids</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Medical Fun Facts (For Kids Using AI) <span class="emoji">🤖🩺🎉</span></h1>
    <p id="fact">Click the button to reveal a new health fact!</p>
    <div class="button-row">
      <button id="newFactButton" type="button">Show Another Fact <span class="emoji">✨</span></button>
      <button id="resetButton" class="hidden" type="button">Reset Fact <span class="emoji">♻️</span></button>
    </div>
    <div class="footer">Fun health facts for kids, powered by AI 🤖</div>
  </div>

  <script>
    const facts = [
      "Kids should drink plenty of water to stay hydrated and healthy! 💧",
      "Eating colorful fruits and veggies helps your body fight germs. 🥕🍎",
      "Getting enough sleep helps kids grow tall and strong. 😴",
      "Washing hands with soap keeps away sickness. 🧼",
      "Playing outside makes you happy and healthy. 🌞",
      "Brushing teeth twice a day prevents cavities. 🦷",
      "Vaccines protect kids from serious diseases. 💉",
      "A balanced diet with proteins, carbs, and fats keeps you energized. 🍞🥚",
      "Regular check-ups with the doctor help catch problems early. 👨‍⚕️",
      "Laughing and smiling boost your immune system! 😄",
      "Kids need hugs and love to feel safe and grow well. 🤗",
      "Exercising daily keeps your heart happy. ❤️",
      "Reading books stimulates your brain and imagination. 📚",
      "Spending time with family strengthens bonds and health. 👨‍👩‍👧‍👦",
      "AI helps doctors predict and prevent illnesses in children. 🤖",
      "At birth, babies get the Hepatitis B vaccine to protect their liver. 🍼💉",
      "At 2 months, infants receive DTaP vaccine for diphtheria, tetanus, and pertussis. 👶🦠",
      "By 6 months, kids should have multiple doses of vaccines like Hib and PCV13. 📅💉",
      "At 12 months, the MMR vaccine protects against measles, mumps, and rubella. 🦠🛡️",
      "Between 4-6 years, booster shots ensure long-lasting immunity. 💪📆",
    ];

    const factElement = document.getElementById('fact');
    const button = document.getElementById('newFactButton');
    const resetButton = document.getElementById('resetButton');
    const initialMessage = 'Click the button to reveal a new health fact!';

    function getRandomFact() {
      const index = Math.floor(Math.random() * facts.length);
      return facts[index];
    }

    function showRandomFact() {
      factElement.style.opacity = '0';
      factElement.style.transform = 'translateY(10px)';
      setTimeout(() => {
        factElement.textContent = getRandomFact();
        factElement.style.opacity = '1';
        factElement.style.transform = 'translateY(0)';
      }, 250);
    }

    function resetFact() {
      factElement.style.opacity = '0';
      factElement.style.transform = 'translateY(10px)';
      setTimeout(() => {
        factElement.textContent = initialMessage;
        factElement.style.opacity = '1';
        factElement.style.transform = 'translateY(0)';
      }, 250);
    }

    button.addEventListener('click', function() {
      button.classList.add('clicked');
      setTimeout(() => button.classList.remove('clicked'), 600);
      if (resetButton.classList.contains('hidden')) {
        resetButton.classList.remove('hidden');
      }
      showRandomFact();
    });

    resetButton.addEventListener('click', function() {
      resetButton.classList.add('clicked');
      setTimeout(() => resetButton.classList.remove('clicked'), 600);
      resetFact();
    });

    window.addEventListener('DOMContentLoaded', showRandomFact);
  </script>
</body>
</html>
