<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pediatric Health Facts for Kids</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Fun AI-Powered Health Facts for Kids! <span class="emoji">🤖🩺🎉</span></h1>
    <p id="fact">Click the button to reveal a new health fact!</p>
    <button id="newFactButton" type="button">Show Another Fact <span class="emoji">✨</span></button>
    <div class="footer">Fun health facts for kids, powered by AI 🤖</div>
  </div>

  <script>
    const facts = [
      "Kids should drink plenty of water to stay hydrated and healthy! 💧",
      "Eating colorful fruits and veggies helps your body fight germs. 🥕🍎",
      "Getting enough sleep helps kids grow tall and strong. 😴",
      "Washing hands with soap keeps away sickness. 🧼",
      "Playing outside makes you happy and healthy. 🌞",
      "Brushing teeth twice a day prevents cavities. 🦷",
      "Vaccines protect kids from serious diseases. 💉",
      "A balanced diet with proteins, carbs, and fats keeps you energized. 🍞🥚",
      "Regular check-ups with the doctor help catch problems early. 👨‍⚕️",
      "Laughing and smiling boost your immune system! 😄",
      "Kids need hugs and love to feel safe and grow well. 🤗",
      "Exercising daily keeps your heart happy. ❤️",
      "Reading books stimulates your brain and imagination. 📚",
      "Spending time with family strengthens bonds and health. 👨‍👩‍👧‍👦",
      "AI helps doctors predict and prevent illnesses in children. 🤖",
    ];

    const factElement = document.getElementById('fact');
    const button = document.getElementById('newFactButton');

    function getRandomFact() {
      const index = Math.floor(Math.random() * facts.length);
      return facts[index];
    }

    function showRandomFact() {
      factElement.textContent = getRandomFact();
    }

    button.addEventListener('click', showRandomFact);

    window.addEventListener('DOMContentLoaded', showRandomFact);
  </script>
</body>
</html>
